# =============================================================================
#  Cross-Mentoring Digital Banking — pile complète en une commande
#  Crédit du Congo · Groupe Attijariwafa Bank
#
#  Disposez ce fichier À CÔTÉ des deux dossiers :
#     ./cdc-backend/   (API FastAPI)
#     ./cdc-frontend/  (interface Vite)
#     ./docker-compose.yml   <-- ici
#
#  Lancer :   docker compose up --build
#  Ouvrir :   http://localhost:8080   (interface)
#             http://localhost:8000/docs  (API)
#  Comptes de démo (mot de passe demo1234) : rh@cdc.cg · nadia@cdc.cg · sophie@cdc.cg
#  Arrêter :  docker compose down        (ajouter -v pour effacer la base)
# =============================================================================

services:
  # ---------- Base de données PostgreSQL ----------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cdc
      POSTGRES_PASSWORD: cdc
      POSTGRES_DB: cdc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdc -d cdc"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # ---------- API FastAPI ----------
  api:
    build: ./cdc-backend
    environment:
      DATABASE_URL: postgresql://cdc:cdc@db:5432/cdc
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      SEED_ON_STARTUP: "true"
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------- Frontend (build Vite servi par nginx) ----------
  web:
    build:
      context: ./cdc-frontend
      args:
        # URL que le NAVIGATEUR utilisera pour joindre l'API (port publié sur l'hôte).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
